# Compose padrão (ADR-001): roda igual em `docker compose` e em `podman compose`.
# Neste host o runner é `podman compose` (o host não tem Docker).

x-db-environment: &db-environment
  POSTGRES_DB: ${POSTGRES_DB:-b3o}
  POSTGRES_USER: ${POSTGRES_USER:-b3o}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b3o-local}

x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER:-b3o}:${POSTGRES_PASSWORD:-b3o-local}@db:5432/${POSTGRES_DB:-b3o}"

x-runtime: &runtime-base
  build:
    context: .
    target: runtime
  environment: &runtime-env
    B3_DATA_DIR: /data
    TZ: America/Sao_Paulo
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  env_file:
    - path: .env
      required: false
  volumes:
    # único bind mount de dado (ADR-003); o lake sobrevive a `compose down`
    - ./data:/data

services:
  # Journal transacional F6: PostgreSQL em volume nomeado, sem porta publicada.
  db:
    image: postgres:latest
    environment: *db-environment
    volumes:
      # PostgreSQL 18+: o mount pai permite que o entrypoint crie data/PGMAJOR.
      - b3o-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # FastAPI + /mcp (F3). Monta a API HTTP e o MCP Streamable HTTP no mesmo processo.
  app:
    <<: *runtime-base
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *runtime-env
      DATABASE_URL: *database-url
    ports:
      # host 8083 por padrão (a 8080 do host é do Funnel público de outro projeto — ADR-045);
      # B3_APP_PORT permite provar noutra porta quando a 8083
      # está ocupada (a app dentro do container é sempre :8080)
      - "127.0.0.1:${B3_APP_PORT:-8083}:8080"
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn b3o.api:app --host 0.0.0.0 --port 8080

  # Container de ferramentas (image dev): é aqui que se roda `b3o ...`, python, ruff.
  # NÃO há suíte de testes (diretiva do dono, 22/11/2026 — ADR-019).
  test:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *runtime-env
      DATABASE_URL: *database-url
    volumes:
      - ./data:/data
      # código bind para iteração rápida; .venv vive na imagem, nunca no bind (ADR-003)
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/config.yaml:/app/config.yaml
    command: ["b3o", "--help"]

  # backend com --reload (profile dev)
  dev:
    <<: *runtime-base
    build:
      context: .
      target: dev
    profiles: [dev]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *runtime-env
      DATABASE_URL: *database-url
    ports:
      - "127.0.0.1:${B3_APP_PORT:-8083}:8080"
    volumes:
      - ./data:/data
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/config.yaml:/app/config.yaml
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn b3o.api:app --reload --host 0.0.0.0 --port 8080

  # one-shot: baixa e deriva (b3o prepare)
  prepare:
    <<: *runtime-base
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *runtime-env
      DATABASE_URL: *database-url
    command:
      - sh
      - -c
      - alembic upgrade head && exec b3o prepare

  # serviço padrão (sobe com `compose up`): roda ao iniciar e a cada hora.
  # Ciclo sem arquivo novo (COTAHIST 304 + lake já desse arquivo) só confere e dorme;
  # arquivo novo reconstrói o ano, calcula as métricas e avalia o Diário (F7).
  prepare-watch:
    <<: *runtime-base
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *runtime-env
      DATABASE_URL: *database-url
    command:
      - sh
      - -c
      - alembic upgrade head && exec b3o prepare --watch --interval "${B3_WATCH_INTERVAL_MIN:-60}"

  # build do frontend (F5.0): gera frontend/dist no bind, dentro do node:26-slim.
  # node_modules vive em volume nomeado — no bind do Windows não preserva modo e é lento.
  web:
    image: node:26-slim
    profiles: [build]
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - b3o-node-modules:/frontend/node_modules
    command: ["sh", "-c", "npm ci && npm run build"]

  # Vite dev server (profile dev) — NÃO é o caminho oficial de build.
  # CHOKIDAR_USEPOLLING compensa a vigilância de arquivo entre volumes no Windows.
  web-dev:
    image: node:26-slim
    profiles: [dev]
    working_dir: /frontend
    environment:
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "127.0.0.1:${B3_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/frontend
      - b3o-node-modules:/frontend/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]

  # Serviço de benchmark do F10 (Playwright): perfil próprio, isolado do produto.
  # Base oficial FIXA + Dockerfile.bench (só o driver Python, sem deps do produto);
  # Playwright não entra no pyproject/uv.lock. ipc: host é o recomendado pelo
  # Chromium; nenhuma porta é publicada.
  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: b3o-bench:f10
    profiles: [bench]
    working_dir: /scripts
    ipc: host
    environment:
      TZ: America/Sao_Paulo
      B3_HTTP_URL: http://app:8080
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./data:/data
      - ./backend/scripts:/scripts:ro
    command: ["python", "-c", "import playwright; print('bench ok')"]

volumes:
  b3o-node-modules:
  b3o-postgres:

