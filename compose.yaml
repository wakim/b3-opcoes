# Compose padrão (ADR-001): roda igual em `docker compose` e em `podman compose`.
# Neste host o runner é `podman compose` (o host não tem Docker).

x-runtime: &runtime-base
  build:
    context: .
    target: runtime
  environment: &runtime-env
    B3_DATA_DIR: /data
    TZ: America/Sao_Paulo
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  env_file:
    - path: .env
      required: false
  volumes:
    # único bind mount de dado (ADR-003); o lake sobrevive a `compose down`
    - ./data:/data

services:
  # FastAPI + /mcp (entra no F3). Até lá o serviço valida mas não sobe.
  app:
    <<: *runtime-base
    ports:
      - "127.0.0.1:8080:8080"
    command: ["uvicorn", "b3o.api:app", "--host", "0.0.0.0", "--port", "8080"]

  # Container de ferramentas (image dev): é aqui que se roda `b3o ...`, python, ruff.
  # NÃO há suíte de testes (diretiva do dono, 22/11/2026 — ADR-019).
  test:
    build:
      context: .
      target: dev
    environment: *runtime-env
    volumes:
      - ./data:/data
      # código bind para iteração rápida; .venv vive na imagem, nunca no bind (ADR-003)
      - ./backend/src:/app/src
      - ./backend/scripts:/app/scripts
      - ./backend/config.yaml:/app/config.yaml
    command: ["b3o", "--help"]

  # backend com --reload (profile dev)
  dev:
    <<: *runtime-base
    build:
      context: .
      target: dev
    profiles: [dev]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./backend/src:/app/src
      - ./backend/config.yaml:/app/config.yaml
    command: ["uvicorn", "b3o.api:app", "--reload", "--host", "0.0.0.0", "--port", "8080"]

  # one-shot: baixa e deriva (b3o prepare)
  prepare:
    <<: *runtime-base
    profiles: [jobs]
    command: ["b3o", "prepare"]

  # diário às 21:30 BRT (b3o prepare --watch)
  prepare-watch:
    <<: *runtime-base
    profiles: [watch]
    command: ["b3o", "prepare", "--watch"]

  # build do frontend (inerte até o F5.0 — não tem frontend/ ainda)
  web:
    image: node:26-slim
    profiles: [build]
    working_dir: /frontend
    command: ["sh", "-c", "echo 'build do frontend entra no F5.0 (npm ci && npm run build)'; exit 0"]
