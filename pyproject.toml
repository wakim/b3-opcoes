[project]
name = "b3o"
version = "0.1.0"
description = "Opções B3 — apoio pessoal à decisão em opções de ações, sobre dados EOD públicos da B3"
readme = "README.md"
requires-python = ">=3.15"
license = { text = "private" }
dependencies = [
    # download condicional (ETag/If-Modified-Since), timeout, retry — ADR-004
    "httpx>=0.28.1",
    # CLI — typer 0.29: declarar @app.callback() na raiz (AGENTS.md); nunca importar click direto
    "typer>=0.29.2",
    # contratos de dados (falha explícita com code/message/hint)
    "pydantic>=2.14.4",
    # cálculo vetorizado (Black-76, gregas, Yang-Zhang) — sem pandas, sem scipy (ADR-004)
    "numpy>=2.5.5",
    # lake: Parquet particionado por year, escrita atômica
    "pyarrow>=26.0.1",
    # leitura do lake; conect só em store/ e query/service.py (teste de arquitetura)
    "duckdb>=2.0.1",
    # config.yaml plano (P-B)
    "pyyaml>=6.0.4",
]

[project.scripts]
b3o = "b3o.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b3o"]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
